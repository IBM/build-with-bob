<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}
  </title>

  <meta
    name="description"
    content="{{ site.Params.description }}"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">

  <!-- lottie-web for Bob waving animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="content-wrapper header-inner">
      <a href="{{ "/" | relURL }}" class="brand-logo" aria-label="IBM Build with Bob">
        <span class="ibm-prefix">IBM</span>
        <span class="brand-title">Build with <strong>Bob</strong></span>
      </a>

      <nav class="site-nav" aria-label="Main Navigation">
        <a href="{{ "/" | relURL }}#projects" class="nav-link">Projects</a>
        <a href="{{ "creators/" | relURL }}" class="nav-link">Creators</a>
        <a href="{{ "/" | relURL }}#community" class="nav-link">Community</a>
        <a href="{{ "/" | relURL }}#journey" class="nav-link">Learn</a>
        <a href="{{ "/" | relURL }}#download" class="nav-link">Try Bob</a>
      </nav>

      <div class="header-cta">
        <a href="{{ "/" | relURL }}#download" class="btn btn-primary btn-sm">Download Bob</a>
      </div>
    </div>
  </header>

  <main id="main-content">
    {{ block "main" . }}
    {{ end }}
  </main>

  <footer class="site-footer">
    <div class="content-wrapper footer-inner">
      <div class="footer-brand">
        <span class="ibm-prefix">IBM</span>
        <span class="footer-title">Build with <strong>Bob</strong></span>
      </div>
      <nav class="footer-nav" aria-label="Footer Navigation">
        <a href="{{ "/" | relURL }}#projects" class="footer-link">Projects</a>
        <a href="{{ "creators/" | relURL }}" class="footer-link">Creators</a>
        <a href="{{ "/" | relURL }}#community" class="footer-link">Community</a>
        <a href="{{ "/" | relURL }}#journey" class="footer-link">Learn</a>
        <a href="{{ "/" | relURL }}#download" class="footer-link">Try Bob</a>
      </nav>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('bob-lottie');
      if (!el || typeof lottie === 'undefined') return;
      lottie.loadAnimation({
        container: el,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '{{ "animations/bob-wave.json" | relURL }}'
      });
    })();
  </script>

</body>
</html>
